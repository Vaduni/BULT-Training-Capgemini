<div class="container">

  <h1>Smart Shopping Cart</h1>

  <div class="stats">

    <div class="stat-card">
      <h3>Total Revenue</h3>
      <p>Rs.{{ totalRevenue }}</p>
    </div>

    <div class="stat-card">
      <h3>Total Items Sold</h3>
      <p>{{ totalItemsSold }}</p>
    </div>

  </div>

  @if(warningMessage){
    <div class="warning">
      {{ warningMessage }}
    </div>
  }

  <app-shopping-cart
    [productCatalog]="products"
    (checkoutCompleted)="handleCheckout($event)"
    (cartWarning)="handleWarning($event)"
  >
  </app-shopping-cart>
  <app-customer-profile>
</app-customer-profile>

</div>
